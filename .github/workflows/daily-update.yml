name: Statistics Canada daily update

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
      timezone: 'America/Toronto' # Same local time as Montréal, including DST

permissions:
  contents: read

concurrency:
  group: statdata-daily-etl
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Statistics Canada datasets in Neon
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Neon secret is configured
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo '::error::Add the DATABASE_URL repository secret before running this workflow.'
            exit 1
          fi

      - name: Test ETL orchestration (offline)
        run: python -m pytest -q tests/test_daily_update.py

      - name: Refresh all six Statistics Canada datasets
        run: python -u update_all.py

      - name: Check database counts and duplicate keys
        run: python -u tools/check_daily_update.py

      - name: Run website regression tests
        run: python -m pytest -q

      - name: Report failures
        if: failure()
        run: |
          echo '## STATDATA.CA — Daily update failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Review the failed step in the Actions job log. The next scheduled run will retry.' >> "$GITHUB_STEP_SUMMARY"
          echo '::error::Daily Statistics Canada update failed; inspect the job log.'
